services:

  osdrone-ai:

    container_name: osdrone-ai

    build:
      context: .

    image: osdrone-ai:latest

    restart: unless-stopped

    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - warning

    ports:
      - "8010:8000"

    environment:
      TZ: Europe/Paris
      DEBUG: "false"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  backend:
    external: true
